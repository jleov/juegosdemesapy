<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel del dueño · Juegos PY</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c1240">
<link rel="icon" href="../icon-192.png">
<script src="../banquero/peerjs.min.js"></script>
<script>if(!window.Peer) document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');</script>
<script src="../ice.js"></script>
<style>
:root{--cream:#fff8e6;--blue:#0038a8;--red:#d52b1e;--gold:#f2c14e;--muted:#6b6b6b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 30% 10%,#33236e,#120b2b 75%) fixed;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1d1d}
input,button{font:inherit}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px 40px}
h1{color:#fff;text-align:center;margin:0 0 4px;font-size:clamp(26px,6vw,38px);text-shadow:0 3px 0 #000}
h1 span{color:var(--gold)}
.sub{color:#cfc8ea;text-align:center;margin-bottom:16px;font-size:14px}
.box{background:var(--cream);border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.35);margin-bottom:14px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;display:inline-block;text-align:center}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.gray{background:#7a7a7a}.btn.green{background:#2a9d3f}.btn.wide{width:100%}
input[type=password]{width:100%;padding:11px 12px;border:1px solid #c9c2a8;border-radius:10px}
.muted{color:var(--muted);font-size:13px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sum div{background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.sum img{width:38px;height:38px;border-radius:9px}
.sum b{font-size:22px;display:block;line-height:1}
.sum small{color:#cfc8ea}
.game h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:20px}
.game h2 img{width:34px;height:34px;border-radius:8px}
.room{border:1px solid #e6dcc0;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.room .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.room .code{font-size:20px;font-weight:900;letter-spacing:3px;color:var(--blue)}
.pl{margin:6px 0;line-height:1.7}
.pl span{white-space:nowrap;margin-right:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:6px 0 2px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:92%;text-align:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2a9d3f;margin-right:6px;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
/* estadísticas: juegos más jugados */
.st-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.st-tabs button{border:1px solid #d8cfae;background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;color:#333}
.st-tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.st-tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.st-tot div{background:#fff;border:1px solid #e6dcc0;border-radius:10px;padding:8px 10px}
.st-tot b{display:block;font-size:22px;color:var(--blue)}
.st-bar{display:grid;grid-template-columns:28px minmax(90px,170px) 1fr;align-items:center;gap:8px;margin:5px 0}
.st-bar img{width:28px;height:28px;border-radius:7px}
.st-bar .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-bar .tr{background:#efe6c9;border-radius:6px;height:22px;position:relative}
.st-bar .fi{background:var(--blue);height:100%;border-radius:6px;min-width:2px}
.st-bar .fi.top{background:var(--red)}
.st-bar .vl{position:absolute;left:8px;top:2px;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.st-dias{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid #cfc4a0;margin-top:6px}
.st-dias div{flex:1;background:var(--gold);border-radius:3px 3px 0 0;min-height:1px}
.st-dias div:hover{background:#d9a52a}
.st-otras{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.st-otras>div{background:#fff;border:1px solid #e6dcc0;border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.35}
.st-otras img{width:34px;height:34px;border-radius:8px;flex:none}
.st-otras b{display:block;font-size:14px}
.st-otras em{font-style:normal;font-weight:900;font-size:18px;color:#7b3fb8}
.st-otras small{color:var(--muted)}
.st-busca{width:100%;padding:9px 12px;border:1px solid #c9c2a8;border-radius:10px;margin:4px 0 8px}
.st-par{border-top:1px solid #e6dcc0;padding:7px 2px;display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}
.st-par img{width:30px;height:30px;border-radius:7px}
.st-par .cu{font-size:12px;color:var(--muted)}
.st-par .js span{display:inline-block;background:#fff;border:1px solid #e0d5b5;border-radius:999px;padding:1px 9px;margin:2px 4px 0 0;font-size:13px;font-weight:700}
.st-par .js span.bot{opacity:.55;font-weight:400}
.st-par .js span.hit{background:var(--gold);border-color:#d9a52a}
.st-ej{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
@media(max-width:520px){.st-bar{grid-template-columns:24px 100px 1fr}.st-bar img{width:24px;height:24px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>👑 Panel del <span>dueño</span></h1>
  <div class="sub">Todas las salas abiertas de Juegos Paraguay Digitales: Banquero, Lotería, Face Punch, Peteĩ y los demás.</div>
  <div id="stats" class="box" style="display:none"></div>
  <div id="body"></div>
</div>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){ try{ if(v===undefined) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ const v=localStorage.getItem(k); return v==null?null:JSON.parse(v); }catch(e){ return null; } }
function toast(x){ const t=$('#toast'); t.textContent=x; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',4000); }

// la misma contraseña y la misma llave que el panel del Banquero
const OWNER_PUB = {x:'eLdK1LWh1LGyAlt0IW6Apa9bnuRt1LwLi3D1MQtqtHk', y:'XPx_IfKocm2ZANCG_As4PxsgjToAMnZMEaWlzZWWBKk'};
const PANEL_ID = 'jmdpy26-dueno';
const EC={name:'ECDSA', namedCurve:'P-256'}, SIG={name:'ECDSA', hash:'SHA-256'};
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function keyFromPassword(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const d=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode('banquero-paraguayo-dueno-v1'), iterations:300000, hash:'SHA-256'}, base, 256));
  const der=new Uint8Array([0x30,0x41,0x02,0x01,0x00,0x30,0x13,0x06,0x07,0x2a,0x86,0x48,0xce,0x3d,0x02,0x01,0x06,0x08,0x2a,0x86,0x48,0xce,0x3d,0x03,0x01,0x07,0x04,0x27,0x30,0x25,0x02,0x01,0x01,0x04,0x20, ...d]);
  const key=await crypto.subtle.importKey('pkcs8', der, EC, true, ['sign']);
  return crypto.subtle.exportKey('jwk', key);
}

const GAMES = {
  banquero:{n:'Banquero Paraguayo', ico:'../banquero/icon-192.png', phase:{lobby:'⏳ En la sala de espera', play:'🎲 Jugando', over:'🏁 Terminada'}},
  loteria: {n:'Lotería',           ico:'../loteria/icon-192.png',  phase:{lobby:'⏳ En la sala de espera', venta:'🎟️ Vendiendo cartones', juego:'🎱 Cantando', fin:'🏁 Ronda terminada'}},
  kombate: {n:'Face Punch',        ico:'../kombate/icon-192.png',  phase:{}},
  uno:     {n:'Peteĩ',             ico:'../petei/icon-192.png',      phase:{lobby:'⏳ En la sala de espera', play:'🃏 Jugando', roundEnd:'🏆 Entre manos', over:'🏁 Terminada'}},
  billar:  {n:'Billar PY',         ico:'../billar/icon-192.png',   phase:{lobby:'⏳ En la sala de espera', play:'🎱 Jugando', rackEnd:'🏆 Entre partidas', over:'🏁 Terminada'}},
  bolos:   {n:'Bolos PY',          ico:'../bolos/icon-192.png',    phase:{lobby:'⏳ En la sala de espera', play:'🎳 Jugando', lineEnd:'🏆 Entre líneas', over:'🏁 Terminada'}},
  minigolf:{n:'Mini Golf PY',      ico:'../minigolf/icon-192.png', phase:{lobby:'⏳ En la sala de espera', play:'⛳ Jugando', holeEnd:'🏁 Entre hoyos', over:'🏆 Terminada'}},
  basta:   {n:'Basta PY',          ico:'../basta/icon-192.png',    phase:{lobby:'⏳ En la sala de espera', abc:'🔤 Frenando el abecedario', pick:'👉 Eligiendo la letra', spin:'🎱 Sacando la letra', write:'✏️ Escribiendo', review:'📝 Revisando palabras', roundEnd:'🧮 Entre rondas', over:'🏆 Terminada'}},
  tejo:    {n:'Tejo PY',           ico:'../tejo/icon-192.png',     phase:{lobby:'⏳ En la sala de espera', play:'🏒 Jugando', matchEnd:'🏆 Entre partidos', over:'🏁 Terminada'}},
  botones: {n:'Botones PY',        ico:'../botones/icon-192.png',  phase:{lobby:'⏳ En la sala de espera', play:'⚽ Jugando', matchEnd:'🏆 Entre partidos', over:'🏁 Terminado'}},
  naval:   {n:'Batalla Naval PY',  ico:'../naval/icon-192.png',    phase:{lobby:'⏳ En la sala de espera', place:'🚢 Poniendo los barcos', play:'💣 Tirando bombas', roundEnd:'🏆 Entre batallas', over:'🏁 Terminada'}},
  ajedrez: {n:'Ajedrez y Damas PY', ico:'../ajedrez/icon-192.png',  phase:{lobby:'⏳ En la sala de espera', play:'♟️ Jugando', gameEnd:'🏆 Entre partidas', over:'🏁 Terminada'}},
  salon:   {n:'Salón de Belleza PY', ico:'../salon/icon-192.png', phase:{lobby:'⏳ En la sala de espera', play:'💇 Atendiendo', review:'🪞 Cliente en el espejo', over:'🏁 Día terminado'}},
  adivina: {n:'¿Mávapa?',          ico:'../mavapa/icon-192.png',  phase:{lobby:'⏳ En la sala de espera', pick:'🤫 Eligiendo personajes', play:'🕵️ Jugando', roundEnd:'🏆 Entre rondas', over:'🏁 Terminada'}},
  mavaiko: {n:'¿Mávaiko Ojuka?',   ico:'../mavaiko/icon-192.png', phase:{lobby:'⏳ En la sala de espera', play:'🔎 Investigando', over:'🏁 Caso cerrado'}},
  escoba:  {n:'Escoba de 15',      ico:'../escoba/icon-192.png',  phase:{lobby:'⏳ En la sala de espera', play:'🧹 Jugando', roundEnd:'🧮 Contando la mano', over:'🏁 Terminada'}},
  impostor:{n:'El Impostor',       ico:'../impostor/icon-192.png', phase:{lobby:'⏳ En la sala de espera', reveal:'🎴 Mirando las tarjetas', clues:'🧉 Dando pistas', discuss:'🗣️ Discutiendo', vote:'🗳️ Votando', result:'🚪 Echaron a alguien', guess:'🎯 El impostor adivina', roundEnd:'🏁 Entre rondas', over:'🏆 Terminada'}},
};
const KIND = {duel:'🥊 Pelea entre dos', bots:'🤖 Sala de bots (con público)', tour:'🏆 Torneo'};
const A={key:null, peer:null, rooms:{}, err:'', pending:{}};

async function login(){
  const pw=$('#pw').value;
  if(pw.length<8) return toast('La contraseña tiene que tener al menos 8 letras o números.');
  if(!window.crypto || !crypto.subtle) return toast('Abrí el panel desde el enlace con https.');
  $('#pw').value=''; $('#msg').textContent='Comprobando…';
  const jwk=await keyFromPassword(pw);
  if(jwk.x!==OWNER_PUB.x || jwk.y!==OWNER_PUB.y){ $('#msg').textContent='❌ Contraseña incorrecta.'; return; }
  store('bnq_owner', jwk); start(jwk);
}
async function start(jwk){
  try{ A.key=await crypto.subtle.importKey('jwk', jwk, EC, false, ['sign']); }
  catch(e){ store('bnq_owner', undefined); A.key=null; return render(); }
  if(jwk.x!==OWNER_PUB.x){ store('bnq_owner', undefined); A.key=null; return render(); }
  A.err='Conectando…'; render();
  const peer=A.peer=new Peer(PANEL_ID, {debug:1, config:{iceServers: window.ICE_SERVERS || [{urls:"stun:stun.l.google.com:19302"}]}});
  peer.on('open', ()=>{ A.err=''; render(); });
  peer.on('disconnected', ()=>{ if(!peer.destroyed) setTimeout(()=>{ try{ peer.reconnect(); }catch(e){} },1500); });
  peer.on('error', e=>{
    if(e.type==='unavailable-id'){ A.err='El panel ya está abierto en otro aparato o pestaña. Cerralo allá y tocá “Reintentar”.'; peer.destroy(); A.peer=null; render(); }
  });
  peer.on('connection', conn=>{
    conn.on('data', async d=>{
      if(!d || typeof d!=='object') return;
      if(d.t==='hi'){ const sig=await crypto.subtle.sign(SIG, A.key, new TextEncoder().encode(String(d.nonce))); conn.send({t:'proof', sig:b64u(sig)}); return; }
      if(d.t==='pong'){ for(const k in A.rooms) if(A.rooms[k].conn===conn) A.rooms[k].at=Date.now(); return; }
      if(!d.game || !d.code || !GAMES[d.game]) return;
      const k=d.game+':'+d.code;
      if(d.t==='room'){
        const old=A.rooms[k];
        if(old && old.conn!==conn){ try{ old.conn.close(); }catch(e){} }   // cambió el anfitrión de esa sala
        A.rooms[k]={game:d.game, code:d.code, conn, info:d.info, at:Date.now()}; conn._k=k;
        render();
      } else if(d.t==='iamOk' && A.pending[k]){
        const w=A.pending[k]; delete A.pending[k];
        if(w.tab && !w.tab.closed) w.tab.location.href=w.url; else location.href=w.url;
      }
    });
    conn.on('close', ()=>{ const r=conn._k && A.rooms[conn._k]; if(r && r.conn===conn){ delete A.rooms[conn._k]; render(); } });
  });
}
setInterval(()=>{   // pulso con cada sala y limpieza de las que ya no responden
  let gone=false;
  for(const k in A.rooms){ const r=A.rooms[k];
    if(Date.now()-r.at>25000){ try{ r.conn.close(); }catch(e){} delete A.rooms[k]; gone=true; continue; }
    if(r.conn.open) try{ r.conn.send({t:'ping'}); }catch(e){} }
  if(gone) render(); else if(A.key) refreshAgo();
}, 5000);
function retry(){ if(A.peer){ try{ A.peer.destroy(); }catch(e){} A.peer=null; } const s=load('bnq_owner'); if(s) start(s); }
function logout(){ if(A.peer) try{ A.peer.destroy(); }catch(e){} Object.assign(A,{peer:null, key:null, rooms:{}, err:''}); Object.assign(ST,{datos:null, err:''}); store('bnq_owner', undefined); render(); }

const ago = t => { if(!t) return ''; const m=Math.round((Date.now()-t)/60000); return m<1?'recién':m<60?`hace ${m} min`:`hace ${Math.floor(m/60)} h ${m%60} min`; };
function refreshAgo(){ document.querySelectorAll('[data-at]').forEach(e=>e.textContent=ago(+e.dataset.at)); }
// token con el que cada juego reconoce a este aparato (el mismo que usa el juego al entrar)
function tokenOf(key){ let t=load(key); if(!t){ t=Math.random().toString(36).slice(2)+Date.now().toString(36); store(key,t); } return t; }
// entrar como dueño (a la vista de todos): la sala anota este aparato y después se abre el juego
function enter(k){
  const r=A.rooms[k]; if(!r || !r.conn.open) return toast('Esa sala ya no responde.');
  const tok = r.game==='uno' ? tokenOf('uno_token') : r.game==='billar' ? tokenOf('billar_token') : r.game==='bolos' ? tokenOf('bolos_token') : r.game==='minigolf' ? tokenOf('golf_token') : r.game==='basta' ? tokenOf('basta_token') : r.game==='tejo' ? tokenOf('tejo_token') : r.game==='botones' ? tokenOf('boton_token') : r.game==='naval' ? tokenOf('naval_token') : r.game==='adivina' ? tokenOf('adivina_token') : r.game==='mavaiko' ? tokenOf('mvk_token') : r.game==='ajedrez' ? tokenOf('ajedrez_token') : r.game==='salon' ? tokenOf('salon_token') : r.game==='escoba' ? tokenOf('esc_token') : r.game==='impostor' ? tokenOf('imp_token') : tokenOf('bnq_token');
  const url = r.game==='uno' || r.game==='billar' || r.game==='bolos' || r.game==='minigolf' || r.game==='basta' || r.game==='tejo' || r.game==='botones' || r.game==='naval' || r.game==='adivina' || r.game==='mavaiko' || r.game==='ajedrez' || r.game==='salon' || r.game==='escoba' || r.game==='impostor' ? `../${r.game==='uno'?'petei':r.game==='adivina'?'mavapa':r.game}/?dueno=1#${r.code}` : `../banquero/#${r.code}`;
  const tab = window.open('about:blank', '_blank');
  A.pending[k]={url, tab};
  try{ r.conn.send({t:'iam', token:tok}); }catch(e){}
  if(r.game==='banquero') toast('Se abre el Banquero con el código puesto: escribí tu nombre y tocá “Entrar”. Vas a entrar como 👑 dueño.');
  setTimeout(()=>{ if(A.pending[k]){ delete A.pending[k]; if(tab && !tab.closed) tab.close(); toast('La sala no contestó. Probá de nuevo.'); } }, 10000);
}

function roomHTML(k, r){
  const i=r.info||{}, G=GAMES[r.game];
  const phase = r.game==='kombate' ? (KIND[i.kind]||'🥊 Sala') : (G.phase[i.phase]||i.phase||'');
  const players=(i.players||[]).map(p=>{
    const extra = r.game==='impostor' ? ` ${p.imp?'🎭':''}${p.out?'🚪':''} · ${p.pts||0} pts` : p.cards!=null ? ` (${p.cards}🂠${i.opts&&i.opts.target?' · '+p.pts+' pts':''})` : '';
    return `<span style="${p.bk?'opacity:.5;text-decoration:line-through':''}">${esc(p.e||'')} ${p.bot?'🤖':''}${esc(p.n)}${!i.local&&p.n===i.host?' 👑':''}${!i.local&&!p.bot&&!p.conn?' ⚠️':''}${extra}</span>`;
  }).join('');
  let det='';
  if(i.turn && r.game==='salon') det+=`<div class="muted">Atendiendo a <b>${esc(i.turn)}</b> · cliente ${i.round}</div>`;
  else if(i.turn) det+=`<div class="muted">Turno de <b>${esc(i.turn)}</b>${i.round?` · ${r.game==='bolos'?'cuadro':r.game==='minigolf'?'hoyo':r.game==='basta'?'ronda':r.game==='tejo'||r.game==='botones'?'partido':r.game==='naval'?'batalla':r.game==='mavaiko'?'caso':r.game==='impostor'?'ronda':'mano'} ${i.round}`:''}</div>`;
  if(r.game==='impostor' && i.word) det+=`<div class="muted">🔑 Palabra: <b>${esc(i.word)}</b> · ronda ${i.round}${i.opts&&i.opts.rounds?' de '+i.opts.rounds:''} · 🎭 = impostor</div>`;
  if(r.game==='loteria') det+=`<div class="muted">${i.cantor?`🎤 Canta <b>${esc(i.cantor)}</b>`:''}${i.phase==='juego'?` · salieron <b>${i.balls}</b> de 90 bolillas`:''}${i.round?` · ronda ${i.round}`:''}</div>`;
  if(r.game==='kombate') det+=`<div class="muted">${i.kind==='duel'?(i.guest?'Los dos peleadores conectados':'Esperando al rival'):`👀 ${i.viewers||0} mirando`}</div>`;
  const obs=i.obs||[];
  if(obs.length) det+=`<div class="muted">👀 Mirando: ${obs.map(o=>(o.owner?'👑 ':'')+esc(o.n)).join(', ')}</div>`;
  let btns='';
  if(r.game==='banquero'){
    if(!i.local) btns+=`<button class="btn sm green" onclick="enter('${k}')">👑 Entrar a la vista</button>`;
    btns+=`<a class="btn sm gray" href="../banquero/#panel-dueno" target="_blank" rel="noopener">🕵️ Mirar sin que me vean (panel del Banquero)</a>`;
  } else if(r.game==='uno' || r.game==='billar' || r.game==='bolos' || r.game==='minigolf' || r.game==='basta' || r.game==='tejo' || r.game==='botones' || r.game==='naval' || r.game==='adivina' || r.game==='mavaiko' || r.game==='ajedrez' || r.game==='salon' || r.game==='escoba' || r.game==='impostor'){
    if(!i.local) btns+=`<button class="btn sm green" onclick="enter('${k}')">👑 Entrar a mirar</button>`;
  } else if(r.game==='loteria'){
    btns+=`<a class="btn sm" href="../loteria/?sala=${encodeURIComponent(r.code)}" target="_blank" rel="noopener">👀 Abrir la sala</a><span class="muted" style="align-self:center">(ahí tocá “Entrar solo a mirar”)</span>`;
  } else if(r.game==='kombate' && i.kind!=='duel'){
    btns+=`<a class="btn sm" href="../kombate/?sala=${encodeURIComponent(r.code)}" target="_blank" rel="noopener">👀 Mirar la pelea</a>`;
  }
  return `<div class="room"><div class="top">${i.local?'<b>📱 Partida en un solo aparato (contra bots)</b>':`<span class="code">${esc(r.code)}</span>`}
      <span class="muted">${esc(phase)}${i.started?` · <span data-at="${i.started}">${ago(i.started)}</span>`:''}</span></div>
    ${players?`<div class="pl">${players}</div>`:''}${det}
    ${btns?`<div class="row">${btns}</div>`:''}
    ${i.local?'<div class="muted" style="margin-top:4px">Se juega en un solo celular o PC: no tiene sala para entrar.</div>':''}</div>`;
}
// ---------- 📊 juegos más jugados (datos de /api/stats, solo con la llave del dueño) ----------
const ST_N = {banquero:['Banquero Paraguayo'], loteria:['Lotería'], kombate:['Face Punch'], petei:['Peteĩ'], escoba:['Escoba de 15'], impostor:['El Impostor'], tarot:['Tarot Jasy'], versiculo:['Versículo del Día'], billar:['Billar PY'], bolos:['Bolos PY'], minigolf:['Mini Golf PY'], basta:['Basta PY'], tejo:['Tejo PY'], botones:['Botones PY'], naval:['Batalla Naval PY'], mavapa:['¿Mávapa?'], mavaiko:['¿Mávaiko Ojuka?'], ajedrez:['Ajedrez y Damas PY'], salon:['Salón de Belleza PY'], odisea:['Odisea','../icon-192.png'], salas:['Salas de Voz'], karaoke:['Sala de Karaoke','../icon-192.png']};
// secciones que no son juegos: se muestran aparte, con lo que la gente hizo en cada una
const OTRAS = {tarot:'lecturas de cartas', versiculo:'versículos pedidos', salas:'entradas a una sala de voz', karaoke:'entradas a una sala de karaoke'};
const ST = {dias:30, que:'p', datos:null, err:'', cargando:false, busca:'', ver:40};
const ST_API = /(^|\.)juegospy\.com$|\.pages\.dev$/.test(location.hostname) ? '/api/stats' : 'https://juegospy.com/api/stats';
async function cargarStats(){
  if(!A.key || ST.cargando) return;
  ST.cargando=true; ST.err=''; renderStats();
  try{
    const ts=Date.now(), sig=b64u(await crypto.subtle.sign(SIG, A.key, new TextEncoder().encode('stats:'+ts)));
    const r=await fetch(ST_API+'?dias=3650&ts='+ts+'&sig='+sig, {cache:'no-store'});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error==='cupo' ? 'cupo:'+(d.x||'') : r.status===503 ? 'falta-db' : (d.error||('error '+r.status)));
    ST.datos=d;
  }catch(e){ ST.err = e.message==='falta-db' ? 'falta-db'
    : e.message.startsWith('cupo:') ? '⏳ '+(e.message.slice(5)||'Se llenó el cupo diario gratis de la base de datos.')+' Mientras tanto no se pueden ver ni anotar los números.'
    : 'No se pudieron traer los números ('+e.message+').'; }
  ST.cargando=false; renderStats();
}
// lista de partidas con sus jugadores (se filtra por nombre o juego sin volver a pedir los datos)
const sinAcento = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function partidasHTML(){
  const desdeTs = ST.dias>=3650 ? 0 : Date.parse(diaMenos(ST.datos.hoy, ST.dias-1)+'T03:00:00Z');
  const b = sinAcento(ST.busca).trim();
  const todas = (ST.datos.partidas||[]).filter(p=>p.ts>=desdeTs);
  const ps = !b ? todas : todas.filter(p=>sinAcento((ST_N[p.juego]||[p.juego])[0]).includes(b) || p.j.some(x=>sinAcento(x.n).includes(b)));
  if(!ps.length) return '<div class="empty">'+(b?'No hay partidas con “'+esc(ST.busca)+'” en este período.':'Todavía no hay partidas anotadas en este período.')+'</div>';
  const cuando = t => new Date(t).toLocaleString('es-PY', {timeZone:'America/Asuncion', weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  return (b?'<div class="muted">'+ps.length+' partida'+(ps.length===1?'':'s')+' con “'+esc(ST.busca)+'”</div>':'')
    + ps.slice(0, ST.ver).map(p=>{ const n=ST_N[p.juego]||[p.juego]; const ic=n[1]||('../'+p.juego+'/icon-192.png');
      return '<div class="st-par"><img src="'+ic+'" alt="" onerror="this.style.visibility=\'hidden\'"><div><div class="cu"><b style="color:#333">'+esc(n[0])+'</b> · '+esc(cuando(p.ts))+'</div><div class="js">'
        + p.j.map(x=>'<span class="'+(x.b?'bot':'')+(b&&sinAcento(x.n).includes(b)?' hit':'')+'">'+(x.b?'🤖 ':'')+esc(x.n)+'</span>').join('') + '</div></div></div>'; }).join('')
    + (ps.length>ST.ver ? '<button class="btn sm gray wide" style="margin-top:8px" data-mas="1">Ver más ('+(ps.length-ST.ver)+')</button>' : '');
}
document.addEventListener('input', e=>{ if(e.target.id!=='stBusca') return; ST.busca=e.target.value; ST.ver=40; const el=$('#stPartidas'); if(el) el.innerHTML=partidasHTML(); });
document.addEventListener('click', e=>{ if(!e.target.closest('#stats [data-mas]')) return; ST.ver+=60; const el=$('#stPartidas'); if(el) el.innerHTML=partidasHTML(); });
function diaMenos(hoy, n){ const d=new Date(hoy+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-n); return d.toISOString().slice(0,10); }
function stTab(k, v, t){ return '<button class="'+(ST[k]===v?'on':'')+'" data-k="'+k+'" data-v="'+v+'">'+t+'</button>'; }
document.addEventListener('click', e=>{ const b=e.target.closest('#stats [data-k]'); if(!b) return; const k=b.dataset.k; ST[k] = k==='dias' ? +b.dataset.v : b.dataset.v; renderStats(); });
function renderStats(){
  const el=$('#stats'); el.style.display = A.key ? '' : 'none'; if(!A.key) return;
  let h='<h2 style="margin:0 0 10px;font-size:20px;display:flex;justify-content:space-between;align-items:center">📊 Juegos más jugados <button class="btn sm gray" onclick="cargarStats()">🔄 Actualizar</button></h2>';
  if(ST.err==='falta-db'){ el.innerHTML=h+'<p>Falta conectar la base de datos en Cloudflare (se hace una sola vez). Cuando esté, acá aparece el gráfico.</p>'; return; }
  if(ST.err){ el.innerHTML=h+'<p>'+esc(ST.err)+'</p>'; return; }
  if(!ST.datos){ el.innerHTML=h+'<p class="muted">'+(ST.cargando?'Cargando…':'')+'</p>'; return; }
  const hoy=ST.datos.hoy, desde = ST.dias>=3650 ? '' : diaMenos(hoy, ST.dias-1);
  const filas=(ST.datos.filas||[]).filter(f=>f.dia>=desde);
  const por={}, dias={}; let tv=0, tp=0, portada=0;
  filas.forEach(f=>{
    if(f.juego==='portada'){ portada+=f.visitas; return; }
    const o=por[f.juego]=por[f.juego]||{v:0,p:0}; o.v+=f.visitas; o.p+=f.partidas; if(OTRAS[f.juego]) return; tv+=f.visitas; tp+=f.partidas;
    const dd=dias[f.dia]=dias[f.dia]||{v:0,p:0}; dd.v+=f.visitas; dd.p+=f.partidas; });
  const k=ST.que;
  const lista=Object.entries(por).filter(([g,o])=>!OTRAS[g] && o[k]>0).sort((a,b)=>b[1][k]-a[1][k]);
  const max=lista.length?lista[0][1][k]:1;
  h+='<div class="st-tabs">'+stTab('dias',1,'Hoy')+stTab('dias',7,'7 días')+stTab('dias',30,'30 días')+stTab('dias',3650,'Todo')+'</div>';
  h+='<div class="st-tabs">'+stTab('que','p','🎲 Partidas empezadas')+stTab('que','v','🚪 Entradas a cada juego')+'</div>';
  h+='<div class="st-tot"><div><b>'+tp+'</b><span class="muted">partidas</span></div><div><b>'+tv+'</b><span class="muted">entradas a juegos</span></div><div><b>'+portada+'</b><span class="muted">visitas a la portada</span></div></div>';
  h+= lista.length ? lista.map(([g,o],i)=>{ const n=ST_N[g]||[g]; const ic=n[1]||('../'+g+'/icon-192.png');
      return '<div class="st-bar"><img src="'+ic+'" alt="" onerror="this.style.visibility=\'hidden\'"><span class="nm" title="'+esc(n[0])+'">'+(i<3?['🥇','🥈','🥉'][i]+' ':'')+esc(n[0])+'</span>'
        +'<div class="tr"><div class="fi'+(i===0?' top':'')+'" style="width:'+Math.max(2,Math.round(o[k]/max*100))+'%"></div><span class="vl">'+o[k]+'</span></div></div>'; }).join('')
    : '<div class="empty">Todavía no hay '+(k==='p'?'partidas':'entradas')+' anotadas en este período.</div>';
  // ✨ otras secciones (tarot, versículo, salas de voz, karaoke): entradas y usos
  const otras=Object.keys(OTRAS).map(g=>[g, por[g]||{v:0,p:0}]).sort((a,b)=>(b[1].p-a[1].p)||(b[1].v-a[1].v));
  h+='<h3 style="margin:16px 0 6px;font-size:15px">✨ Otras secciones</h3><div class="st-otras">'
    + otras.map(([g,o])=>{ const n=ST_N[g]||[g]; const ic=n[1]||('../'+g+'/icon-192.png');
      return '<div><img src="'+ic+'" alt="" onerror="this.style.visibility=\'hidden\'"><span><b>'+esc(n[0])+'</b>'
        +'<em>'+o.p+'</em> '+OTRAS[g]+'<br><small>'+o.v+' entradas</small></span></div>'; }).join('') + '</div>';
  if(ST.dias>1){   // barritas por día (total de todos los juegos)
    const primero=Object.keys(dias).sort()[0];
    const n = ST.dias>=3650 ? Math.min(90, Math.max(7, primero ? Math.round((Date.parse(hoy)-Date.parse(primero))/86400e3)+1 : 7)) : ST.dias;
    const ds=[]; for(let i=n-1;i>=0;i--) ds.push(diaMenos(hoy,i));
    const mx=Math.max(1, ...ds.map(d=>(dias[d]||{})[k]||0));
    const f=d=>d.slice(8,10)+'/'+d.slice(5,7);
    h+='<h3 style="margin:16px 0 0;font-size:15px">'+(k==='p'?'Partidas':'Entradas')+' por día, todos los juegos'+(n===90&&ST.dias>=3650?' (últimos 90 días)':'')+'</h3>'
      +'<div class="st-dias">'+ds.map(d=>{ const v=(dias[d]||{})[k]||0; return '<div style="height:'+Math.round(v/mx*100)+'%" title="'+f(d)+': '+v+'"></div>'; }).join('')+'</div>'
      +'<div class="st-ej"><span>'+f(ds[0])+'</span><span>máximo en un día: '+mx+'</span><span>'+f(ds[ds.length-1])+'</span></div>';
  }
  h+='<h3 style="margin:18px 0 2px;font-size:15px">🕑 Quiénes jugaron</h3><input class="st-busca" id="stBusca" placeholder="Buscar un nombre (ej.: Juan) o un juego" value="'+esc(ST.busca)+'"><div id="stPartidas">'+partidasHTML()+'</div>';
  h+='<p class="muted" style="margin-bottom:0">Se cuenta desde que se agregó el contador. “Partida” = una sala que pasó de la espera a jugar (también contra bots). “Entrada” = alguien abrió el juego o la sección (una vez por pestaña). En otras secciones se cuenta cada lectura, versículo o entrada a una sala. De las personas solo se guarda el nombre que pusieron en el juego (las partidas con nombres se borran solas a los 90 días).</p>';
  el.innerHTML=h;
}

function render(){
  // el recuadro de estadísticas se arma solo al entrar o salir (si no, se borraría lo que se escribe en el buscador)
  if(!!A.key !== ST.mostrado){ ST.mostrado=!!A.key; renderStats(); }
  if(A.key && !ST.datos && !ST.cargando && !ST.err) cargarStats();
  const el=$('#body');
  if(!A.key){
    el.innerHTML=`<div class="box"><p style="margin-top:0">Escribí la contraseña del dueño (la misma del panel del Banquero). Se pide una sola vez en cada aparato.</p>
      <input type="password" id="pw" placeholder="Contraseña del dueño" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
      <button class="btn green wide" style="margin-top:8px" onclick="login()">🔑 Entrar</button><p class="muted" id="msg"></p></div>`;
    return;
  }
  const all=Object.entries(A.rooms).filter(([k,r])=>r.info);
  const byGame=g=>all.filter(([k,r])=>r.game===g).sort((a,b)=>(a[1].info.local?1:0)-(b[1].info.local?1:0));
  el.innerHTML = (A.err?`<div class="box">${esc(A.err)} ${A.peer?'':'<button class="btn sm" onclick="retry()">🔄 Reintentar</button>'}</div>`:'')
    + `<div class="sum">${Object.keys(GAMES).map(g=>`<div><img src="${GAMES[g].ico}" alt=""><span><b>${byGame(g).length}</b><small>${GAMES[g].n}</small></span></div>`).join('')}</div>`
    + `<p class="muted" style="color:#cfc8ea;text-align:center"><span class="dot"></span>Salas abiertas ahora: <b style="color:#fff">${all.length}</b>. Aparecen solas mientras este panel está abierto (tardan unos segundos).</p>`
    + Object.keys(GAMES).map(g=>{ const rs=byGame(g);
        return `<div class="box game"><h2><img src="${GAMES[g].ico}" alt="">${GAMES[g].n} <span class="muted">(${rs.length})</span></h2>
          ${rs.length ? rs.map(([k,r])=>roomHTML(k,r)).join('') : '<div class="empty">🛋️ No hay salas abiertas.</div>'}</div>`; }).join('')
    + `<button class="btn gray wide" onclick="logout()">🔒 Cerrar sesión de dueño en este aparato</button>
       <p class="muted" style="color:#cfc8ea;text-align:center">Face Punch muestra las salas en línea (pelea entre dos, sala de bots y torneo); las peleas contra la máquina no tienen sala.</p>`;
}
render();
const saved=load('bnq_owner'); if(saved) start(saved);
</script>
</body>
