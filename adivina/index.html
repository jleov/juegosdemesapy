<!doctype html>

<head>
<meta charset="utf-8">

<title>¿Mávapa?</title>

<link rel="canonical" href="https://juegospy.com/mavapa/">
<!-- el juego se llama ahora ¿Mávapa? (¿quién es? en guaraní): este enlace viejo lleva al nuevo, con el mismo código de sala -->
<script>location.replace('../mavapa/' + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0; url=../mavapa/">
<style>body{background:#12233f;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:40px 16px}a{color:#f2c14e}</style>
</head>
<body>
<p>El juego ahora se llama <b>¿Mávapa?</b>. <a href="../mavapa/">Tocá acá para entrar</a>.</p>
<script>
// el juego viejo tenía su propio service worker en esta carpeta: se borra junto con lo que guardó
if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{ if(r.scope.endsWith('/adivina/')) r.unregister(); })).catch(()=>{});
if(window.caches) caches.keys().then(ks=>ks.filter(k=>k.startsWith('adivina-')).forEach(k=>caches.delete(k))).catch(()=>{});
</script>
</body>
</html>
