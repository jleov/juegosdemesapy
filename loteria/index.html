<script>
'use strict';
/* ====================== BASE ====================== */
const PREFIX = 'lotpy26-';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gs = n => 'Gs. ' + Math.round(n).toLocaleString('es-PY');
const randInt = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
function load(k, d=null){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function forget(k){ try{ localStorage.removeItem(k); }catch(e){} }
const myToken = load('lot_token') || (()=>{ const t=Math.random().toString(36).slice(2)+Date.now().toString(36); store('lot_token',t); return t; })();
const PREF = Object.assign({name:'', emoji:'🙂', sound:true, voz:true}, load('lot_pref', {}));
const savePref = () => store('lot_pref', PREF);
const EMOJIS = ['🙂','😎','🤠','👵','👴','🧉','🐔','🐶','🐱','🦜','⚽','🌺','👑','🍀','🎩','🦊'];
const BOTS = [['Doña Chela','👵'],['Don Ramón','👴'],['Tía Nilda','🌺'],['Karai Pedro','🤠'],['Mirna','🦜'],['Toto','⚽'],['Ña Petrona','🧉'],['Cholo','🐔'],['Tío Beto','🎩'],['Kuña Lucía','🍀']];
const MAX_JUG = 10;   // jugadores por sala (cada uno puede tener 2 cartones: 20 cartones de colores distintos)
const MAX_SALA = 50;  // con espectadores incluidos
const jugadores = () => S.players.filter(p=>!p.esp);
const DEF_CFG = {precio:500, saldo:10000, max:2, serie:20, modo:'linea', pctLinea:30, aTiempo:true, falso:'nada', gracia:4};

let S = null;   // estado del juego: el anfitrión es la autoridad, los demás reciben copias
const NET = {mode:null, peer:null, conns:{}, hostConn:null, code:'', myPid:null, welcomed:false};
const T = {auto:null, autoKey:'', claim:null};
const UI = {seenDrawn:0, seenRound:0, seenClaim:null, seenResult:null, closedResult:null, unread:0, chatSeen:0, menuCode:'', grabados:[]};

function toast(x){ const t=$('#toast'); t.textContent=x; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none', 3200); }
function netBar(x){ const b=$('#netbar'); if(x){ b.textContent=x; b.style.display='block'; } else b.style.display='none'; }
function genCode(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({length:5},()=>a[randInt(a.length)]).join(''); }

/* ====================== SONIDO Y VOZ ====================== */
let AC=null;
function beep(f=660, d=.12, type='sine', vol=.15, delay=0){
  if(!PREF.sound) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+delay;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const fanfare = () => [523,659,784,1046].forEach((f,i)=>beep(f,.25,'triangle',.18,i*.13));
const buzz = () => { beep(140,.5,'sawtooth',.12); };
// El cantor elegido puede ser una voz automática (PREF.cantor = 'don', 'dona'…), uno grabado en este dispositivo ('rec:<id>')
// o la voz de la casa ('casa'): cantos grabados que vienen con el juego (voz-casa/) y suenan por defecto para todos.
const CASA_URL = 'voz-casa/';
const cantorElegido = () => PREF.cantor || (UI.casa ? 'casa' : 'don');
const esCasa = () => cantorElegido()==='casa' && !!UI.casa;
const esGrabado = () => String(PREF.cantor||'').startsWith('rec:');
const recId = () => esGrabado() ? PREF.cantor.slice(4) : null;
const recInfo = id => (UI.grabados||[]).find(g=>g.id===(id||recId()));
const baseTTS = () => esGrabado() ? (recInfo()||{}).base : esCasa() ? UI.casa.base : cantorElegido()==='casa' ? 'don' : cantorElegido();
const textosElegidos = () => esGrabado() ? (recInfo()||{}).textos : esCasa() ? UI.casa.textos : null;
async function cargarCasa(){
  try{ const r=await fetch(CASA_URL+'cantor.json', {cache:'no-cache'}); if(r.ok){ const c=await r.json(); if(c && c.archivos){ c.textos=limpiarTextos(c.textos); UI.casa=c; } } }catch(e){}
}
// toca la grabación de la voz de la casa para ese número (si la tiene)
function tocarCasa(n){ const f=UI.casa && UI.casa.archivos[n]; return f ? tocarUrl(CASA_URL+f) : Promise.reject(new Error('sin grabación')); }
function say(txt, forzar){ if(PREF.voz || forzar) hablarTTS(txt, baseTTS()); }
async function cargarGrabados(){
  try{ const ls=(await CantosDB.lista()).filter(c=>!(c.casa && UI.casa));   // la copia de la voz de la casa del grabador no se repite
    UI.grabados=await Promise.all(ls.map(async c=>({...c, cuantos:(await CantosDB.numeros(c.id)).length}))); }
  catch(e){ UI.grabados=[]; }
  // si comparto mi voz con la sala y cambié textos en el grabador, se actualizan para todos
  const g=S && S.vozSala && S.vozSala.pid===NET.myPid && recInfo(PREF.vozSalaId);   // (también si la ofrecí y todavía no la aceptaron)
  if(g && (g.nombre!==S.vozSala.nombre || JSON.stringify(limpiarTextos(g.textos))!==JSON.stringify(S.vozSala.textos||{})))
    doAct({t:'vozSala', on:true, nombre:g.nombre, base:g.base, textos:g.textos});
}
// el dicho que se ve en pantalla: el texto propio del cantor grabado si tiene, si no el dicho de siempre
const dichoMostrado = n => S && S.vozSala && P(S.vozSala.pid) ? dichoDe(n, S.vozSala.textos) : dichoDe(n, textosElegidos());
// canta con el cantor que elegí en este dispositivo (si es grabado y falta el número, usa su voz automática)
async function cantarLocal(n){
  if(!PREF.voz) return;
  if(esGrabado()){ try{ const c=await CantosDB.clip(recId(), n); if(c){ await tocarBlob(c.blob); return; } }catch(e){} }
  if(esCasa()){ try{ await tocarCasa(n); return; }catch(e){} }
  hablarTTS(textoCanto(n, textosElegidos()), baseTTS());
}
/* ---------- voz de la sala: el cantor comparte su voz grabada y todos la escuchan ---------- */
function anunciarBolilla(n, idx){
  const vs=S.vozSala;
  if(vs && P(vs.pid)){
    if(vs.pid===NET.myPid){ compartirCanto(n, idx); return; }
    if(!PREF.voz) return;
    // espero el audio del cantor; si no llega a tiempo, canta la voz automática que él eligió
    clearTimeout(UI.esperaT); UI.espera={idx};
    UI.esperaT=setTimeout(()=>{ if(UI.espera && UI.espera.idx===idx){ UI.espera=null; hablarTTS(textoCanto(n, vs.textos), vs.base); } }, 2500);
    return;
  }
  cantarLocal(n);
}
async function compartirCanto(n, idx){
  const vs=S.vozSala; let msg={t:'canto', round:S.round, idx, n, none:true}, blob=null;
  try{ const c=PREF.vozSalaId && await CantosDB.clip(PREF.vozSalaId, n);
    if(c){ blob=c.blob; msg={t:'canto', round:S.round, idx, n, type:c.type, data:await c.blob.arrayBuffer()}; } }catch(e){}
  enviarCanto(msg);
  if(PREF.voz){ if(blob) tocarBlob(blob).catch(()=>hablarTTS(textoCanto(n, vs.textos), vs.base)); else hablarTTS(textoCanto(n, vs.textos), vs.base); }
}
function enviarCanto(msg, excepto){
  if(NET.mode==='host'){ for(const pid in NET.conns){ if(pid===excepto) continue; const c=NET.conns[pid]; if(c && c.open) try{ c.send(msg); }catch(e){} } }
  else if(NET.hostConn && NET.hostConn.open) try{ NET.hostConn.send(msg); }catch(e){}
}
function recibirCanto(d){
  if(!S || !S.vozSala || d.round!==S.round || d.idx!==S.drawn.length || !PREF.voz) return;
  if(!UI.espera || UI.espera.idx!==d.idx) return;   // ya cantó la voz automática
  clearTimeout(UI.esperaT); UI.espera=null;
  if(d.none || !d.data){ hablarTTS(textoCanto(d.n, S.vozSala.textos), S.vozSala.base); return; }
  tocarBlob(new Blob([d.data], {type:d.type||'audio/webm'})).catch(()=>hablarTTS(textoCanto(d.n, S.vozSala.textos), S.vozSala.base));
}

/* ====================== CARTONES ====================== */
// Cartón de 90 bolillas como en la lotería real: 3 filas x 9 columnas, 5 números por fila (15 en total).
// Columna 1: del 1 al 9, columna 2: del 10 al 19 … columna 9: del 80 al 90. Cada columna tiene de 1 a 3 números, ordenados de arriba hacia abajo.
const colRange = c => c===0 ? [1,9] : c===8 ? [80,90] : [c*10, c*10+9];
// usados: números que ya tienen las otras combinaciones del mismo cartón (no se repiten entre ellas)
function genCard(usados=new Set()){
  const cnt = Array(9).fill(1); let extra = 6;
  while(extra){ const c=randInt(9); if(cnt[c]<3){ cnt[c]++; extra--; } }
  const g = [0,1,2].map(()=>Array(9).fill(0)), rc=[0,0,0];
  const order = [...Array(9).keys()].map(c=>[c,Math.random()]).sort((a,b)=>cnt[b[0]]-cnt[a[0]] || a[1]-b[1]).map(x=>x[0]);
  for(const c of order){
    const rows = [0,1,2].map(r=>[r,Math.random()]).sort((a,b)=>rc[a[0]]-rc[b[0]] || a[1]-b[1]).slice(0,cnt[c]).map(x=>x[0]).sort((a,b)=>a-b);
    const [lo,hi] = colRange(c), nums=[];
    while(nums.length<cnt[c]){ const n=lo+randInt(hi-lo+1); if(!nums.includes(n) && !usados.has(n)) nums.push(n); }
    nums.sort((a,b)=>a-b);
    rows.forEach((r,i)=>{ g[r][c]=nums[i]; rc[r]++; usados.add(nums[i]); });
  }
  return g;
}
// Un cartón es de un solo color y trae 3 combinaciones: Serie 1, Serie 2 y Serie 3, sin números repetidos entre ellas
// (3 x 15 = 45 números). Como cada columna lleva hasta 3 números por combinación, siempre alcanzan.
// 20 colores: alcanza para 10 jugadores con 2 cartones cada uno, todos de distinto color.
const COLORES = ['#1f9d55','#d52b1e','#1f5fbf','#2b2b2b','#e8730c','#7d3c98','#8b5a2b','#1597b8','#d6337f','#0b6b3a',
                 '#1b2f7a','#8a1c2b','#b8860b','#0f8f84','#5f6b73','#9b59b6','#6b7a1f','#e0604f','#4b3fb3','#b5532a'];
const colorDe = p => COLORES[(p-1) % COLORES.length];
const cardNums = g => g.flat().filter(Boolean);
const myCards = pid => Object.keys(S.owner||{}).filter(c=>S.owner[c]===pid).map(Number).sort((a,b)=>a-b);
const myPlanchas = pid => Object.keys(S.planchas||{}).map(Number).filter(p=>S.owner[S.planchas[p][0]]===pid);
const infoDe = c => (S.info && S.info[c]) || {p:Math.ceil(c/3), serie:(c-1)%3+1};

/* ====================== ESTADO (anfitrión) ====================== */
function lobbyState(){
  return {phase:'lobby', round:0, players:[], hostPid:null, cantorPid:null, cfg:{...DEF_CFG}, cards:{}, owner:{}, anulados:{},
    drawn:[], stage:'linea', pozo:{linea:0,bingo:0}, acum:0, winners:{linea:[],bingo:[]}, claim:null, result:null, auto:0,
    lastBallAt:0, resumen:null, chat:[], deudas:[], pedidos:[], vozSala:null, nextId:1};
}
const P = id => S && S.players.find(p=>p.id===id);
function addPlayer(name, emoji, token, bot){
  const p={id:'p'+(S.nextId++), name, emoji, token, saldo:S.cfg.saldo, conn:true, bot:!!bot};
  S.players.push(p); return p;
}
function sys(x){ S.chat.push({sys:true, x, at:Date.now()}); if(S.chat.length>120) S.chat.shift(); }
const monto = v => { v=Math.floor((+v||0)/500)*500; return v>=500 && v<=1000000 ? v : 0; };
const cleanName = s => String(s||'').replace(/\s+/g,' ').trim().slice(0,18) || 'Jugador';
function sanitizeCfg(c){
  const n=(v,lo,hi,d)=>{ v=Math.round(+v); return isFinite(v) ? Math.max(lo,Math.min(hi,v)) : d; };
  return {
    precio:Math.round(n(c.precio,500,20000,500)/500)*500, saldo:+c.saldo===20000?20000:10000, max:n(c.max,1,4,2), serie:n(c.serie,4,40,20),
    modo:c.modo==='bingo'?'bingo':'linea', pctLinea:n(c.pctLinea,5,60,30), aTiempo:!!c.aTiempo,
    falso:['anular','multa','nada'].includes(c.falso)?c.falso:'nada', gracia:n(c.gracia,2,10,4)
  };
}
function abrirVenta(){
  S.round++; S.phase='venta'; S.cards={}; S.owner={}; S.anulados={}; S.drawn=[]; S.stage=S.cfg.modo==='linea'?'linea':'bingo';
  S.winners={linea:[],bingo:[]}; S.claim=null; S.result=null; S.resumen=null; S.auto=0; S.pozo={linea:0,bingo:0};
  S.info={}; S.planchas={};
  for(let p=1;p<=S.cfg.serie;p++){
    const usados=new Set();
    S.planchas[p]=[1,2,3].map(serie=>{ const id=(p-1)*3+serie; S.cards[id]=genCard(usados); S.info[id]={p, serie}; return id; });
  }
  sys(`🎟️ Ronda ${S.round}: ¡a elegir cartones! Cada cartón trae 3 combinaciones y cuesta ${gs(S.cfg.precio)}.`);
  botsBuy();
}
function draw(){
  const rest=[]; for(let n=1;n<=90;n++) if(!S.drawn.includes(n)) rest.push(n);
  if(!rest.length) return;
  S.drawn.push(rest[randInt(rest.length)]); S.result=null; S.lastBallAt=Date.now();
  botsCheck();
}
function act(pid, a){
  const p=P(pid); if(!p || !a) return 'No estás en la sala.';
  const isHost = pid===S.hostPid, isCantor = pid===S.cantorPid;
  switch(a.t){
    case 'cfg':
      if(!isHost || !['lobby','fin'].includes(S.phase)) return;
      S.cfg = sanitizeCfg({...S.cfg, ...a.cfg});
      if(S.round===0) S.players.forEach(x=>x.saldo=S.cfg.saldo);
      break;
    case 'bot': {
      if(!isHost || S.phase==='juego') return;
      if(jugadores().length>=MAX_JUG) return `La sala ya tiene ${MAX_JUG} jugadores.`;
      const used=S.players.map(x=>x.name), b=BOTS.find(b=>!used.includes(b[0]));
      if(!b) return 'Ya están todos los vecinos de la casa.';
      addPlayer(b[0], b[1], null, true); sys(`${b[1]} ${b[0]} se sentó a jugar.`);
      if(S.phase==='venta') botsBuy();
      break; }
    case 'quitar': {
      const q=P(a.pid); if(!isHost || !q || q.id===S.hostPid || S.phase==='juego') return;
      myCards(q.id).forEach(c=>{ delete S.owner[c]; });
      S.players=S.players.filter(x=>x!==q); if(S.cantorPid===q.id) S.cantorPid=S.hostPid;
      if(S.vozSala && S.vozSala.pid===q.id) S.vozSala=null;
      if(S.vozOferta && S.vozOferta.pid===q.id) S.vozOferta=null;
      S.deudas=(S.deudas||[]).filter(d=>d.de!==q.id && d.a!==q.id); S.pedidos=(S.pedidos||[]).filter(x=>x.pid!==q.id);
      if(NET.conns[q.id]){ try{ NET.conns[q.id].send({t:'kicked'}); NET.conns[q.id].close(); }catch(e){} delete NET.conns[q.id]; }
      sys(`${q.emoji} ${q.name} salió de la sala.`);
      break; }
    case 'cantor': {
      const q=P(a.pid); if(!isHost || !q || q.bot) return;
      if(S.cantorPid===q.id) return;
      S.cantorPid=q.id; sys(`🎤 ${q.emoji} ${q.name} es el cantor: saca las bolillas.`);
      break; }
    /* ---------- voz grabada de la sala ----------
       El que saca las bolillas (cantor) y la voz que se escucha pueden ser personas distintas: cualquier jugador ofrece
       su voz grabada y el cantor o el anfitrión la acepta. El audio sale del dispositivo del dueño de la voz. */
    case 'vozSala': {
      const vs=S.vozSala, esDuenio = vs && vs.pid===pid;
      if(!a.on){ if(!(esDuenio || isHost || isCantor)) return; if(vs) sys(`🎙️ Se dejó de usar la voz grabada «${vs.nombre}».`); S.vozSala=null; break; }
      // el cantor pone su propia voz, o el dueño de la voz que ya suena actualiza nombre y textos
      if(!(isCantor || esDuenio)) return act(pid, {...a, t:'ofrecerVoz'});
      S.vozSala={pid, nombre:String(a.nombre||'Cantor').slice(0,30), base:cantorTTS(a.base).id, textos:limpiarTextos(a.textos)};
      if(S.vozOferta && S.vozOferta.pid===pid) S.vozOferta=null;
      if(!esDuenio) sys(`🎙️ Ahora canta «${S.vozSala.nombre}», la voz grabada de ${p.emoji} ${p.name}. ¡Todos la escuchan!`);
      break; }
    case 'ofrecerVoz':
      if(p.bot) return;
      if(isCantor) return act(pid, {...a, t:'vozSala', on:true});
      S.vozOferta={pid, nombre:String(a.nombre||'Cantor').slice(0,30), base:cantorTTS(a.base).id, textos:limpiarTextos(a.textos)};
      sys(`🎙️ ${p.emoji} ${p.name} ofrece su voz grabada «${S.vozOferta.nombre}» para cantar las bolillas. El cantor o el anfitrión la puede aceptar.`);
      break;
    case 'aceptarVoz': {
      const of=S.vozOferta; if(!(isHost || isCantor) || !of || !P(of.pid)) return;
      S.vozSala={...of}; S.vozOferta=null;
      sys(`🎙️ Ahora canta «${of.nombre}», la voz grabada de ${P(of.pid).emoji} ${P(of.pid).name}. ¡Todos la escuchan!`);
      break; }
    case 'rechazarVoz':
      if(!(isHost || isCantor) && !(S.vozOferta && S.vozOferta.pid===pid)) return;
      S.vozOferta=null; break;
    case 'recargar': {
      const q=P(a.pid); if(!isHost || !q || S.phase==='juego') return;
      q.saldo += S.cfg.saldo; sys(`💵 ${q.emoji} ${q.name} recibió ${gs(S.cfg.saldo)} de saldo.`);
      break; }
    /* ---------- préstamos entre jugadores ---------- */
    case 'prestar': {
      const q=P(a.to), m=monto(a.monto); S.deudas=S.deudas||[]; S.pedidos=S.pedidos||[];
      if(!q || q.id===pid || q.bot) return;
      if(!m) return 'El préstamo es desde Gs. 500, de a 500.';
      if(p.saldo<m) return 'No te alcanza el saldo para prestar eso.';
      p.saldo-=m; q.saldo+=m;
      const d=S.deudas.find(d=>d.de===q.id && d.a===pid);
      if(d) d.monto+=m; else S.deudas.push({id:'d'+(S.nextId++), de:q.id, a:pid, monto:m});
      const ped=S.pedidos.find(x=>x.pid===q.id);
      if(ped){ ped.monto-=m; if(ped.monto<=0) S.pedidos=S.pedidos.filter(x=>x!==ped); }
      sys(`💸 ${p.emoji} ${p.name} le prestó ${gs(m)} a ${q.emoji} ${q.name}.`);
      break; }
    case 'pedir': {
      const m=monto(a.monto); S.pedidos=(S.pedidos||[]).filter(x=>x.pid!==pid);
      if(!m) return 'Pedí desde Gs. 500, de a 500.';
      S.pedidos.push({id:'r'+(S.nextId++), pid, monto:m});
      sys(`🙏 ${p.emoji} ${p.name} pide ${gs(m)} prestado. (Tocá 💸 arriba para prestarle)`);
      botsLend();
      break; }
    case 'noPedir':
      S.pedidos=(S.pedidos||[]).filter(x=>x.pid!==pid); break;
    case 'pagar': {
      const d=(S.deudas||[]).find(d=>d.id===a.id); if(!d || d.de!==pid) return;
      const q=P(d.a), m=Math.min(d.monto, p.saldo);
      if(m<=0) return 'No tenés saldo para pagar.';
      p.saldo-=m; if(q) q.saldo+=m; d.monto-=m;
      if(d.monto<=0) S.deudas=S.deudas.filter(x=>x!==d);
      sys(`🤝 ${p.emoji} ${p.name} le devolvió ${gs(m)} a ${q?q.emoji+' '+q.name:'quien le prestó'}${d.monto>0?` (todavía debe ${gs(d.monto)})`:' y quedó a mano'}.`);
      break; }
    case 'perdonar': {
      const d=(S.deudas||[]).find(d=>d.id===a.id); if(!d || d.a!==pid) return;
      const q=P(d.de); S.deudas=S.deudas.filter(x=>x!==d);
      sys(`😇 ${p.emoji} ${p.name} le perdonó la deuda de ${gs(d.monto)} a ${q?q.emoji+' '+q.name:'un jugador'}.`);
      break; }
    case 'abrir':
      if(!isHost || !['lobby','fin'].includes(S.phase)) return;
      abrirVenta(); break;
    case 'lobby':
      if(!isHost || S.phase!=='fin') return;
      S.phase='lobby'; break;
    // espectador que pasa a jugar (si hay lugar en la mesa) o jugador que deja su lugar para mirar
    case 'jugar':
      if(!p.esp) return;
      if(S.phase==='juego') return 'Esperá a que termine la ronda para sumarte a la mesa.';
      if(jugadores().length>=MAX_JUG) return `La mesa sigue completa (${MAX_JUG} jugadores).`;
      p.esp=false; sys(`🎟️ ${p.emoji} ${p.name} se sumó a la mesa como jugador.`); break;
    case 'mirar':
      if(p.esp || p.bot) return;
      if(S.phase==='juego' && myCards(pid).length) return 'Tenés cartones en juego: podés pasar a mirar cuando termine la ronda.';
      if(S.phase==='venta') myPlanchas(pid).forEach(q=>{ S.planchas[q].forEach(c=>delete S.owner[c]); p.saldo+=S.cfg.precio; });
      p.esp=true; sys(`👀 ${p.emoji} ${p.name} dejó su lugar en la mesa y ahora mira como espectador.`); break;
    // se compra el cartón entero: sus 3 combinaciones
    case 'comprar': {
      if(S.phase!=='venta') return 'La venta de cartones está cerrada.';
      if(p.esp) return `Estás como espectador: la mesa ya tiene ${MAX_JUG} jugadores.`;
      const ids=(S.planchas||{})[+a.plancha]; if(!ids) return;
      if(S.owner[ids[0]]) return S.owner[ids[0]]===pid ? undefined : 'Ese cartón ya lo eligió otro jugador.';
      if(myPlanchas(pid).length>=S.cfg.max) return `Máximo ${S.cfg.max} ${S.cfg.max>1?'cartones':'cartón'} por jugador.`;
      if(p.saldo<S.cfg.precio) return 'No te alcanza el saldo para otro cartón.';
      ids.forEach(c=>S.owner[c]=pid); p.saldo-=S.cfg.precio; break; }
    case 'devolver': {
      const ids=(S.planchas||{})[+a.plancha]; if(S.phase!=='venta' || !ids || S.owner[ids[0]]!==pid) return;
      ids.forEach(c=>delete S.owner[c]); p.saldo+=S.cfg.precio; break; }
    case 'azar': {
      if(S.phase!=='venta') return;
      const libres=Object.keys(S.planchas||{}).filter(q=>!S.owner[S.planchas[q][0]]);
      if(!libres.length) return 'Ya no quedan cartones libres.';
      return act(pid, {t:'comprar', plancha:libres[randInt(libres.length)]}); }
    case 'empezar': {
      if(!(isHost||isCantor) || S.phase!=='venta') return;
      const vend=Object.keys(S.planchas).filter(q=>S.owner[S.planchas[q][0]]); if(!vend.length) return 'Nadie eligió cartones todavía.';
      for(const c in S.cards) if(!S.owner[c]) delete S.cards[c];
      for(const q in S.planchas) if(!S.owner[S.planchas[q][0]]) delete S.planchas[q];
      const total=vend.length*S.cfg.precio;
      S.pozo.linea = S.cfg.modo==='linea' ? Math.round(total*S.cfg.pctLinea/100) : 0;
      S.pozo.bingo = total - S.pozo.linea + S.acum;
      if(S.acum) sys(`💰 Se suma el pozo acumulado de ${gs(S.acum)} a la lotería.`);
      S.acum=0; S.phase='juego'; S.drawn=[]; S.lastBallAt=0;
      sys(`🎱 ¡Empieza la ronda ${S.round}! ${vend.length} cartones vendidos. Pozo: ${gs(S.pozo.linea+S.pozo.bingo)}.`);
      break; }
    case 'sacar':
      if(!(isCantor||isHost)) return 'Solo el cantor saca las bolillas.';
      if(S.phase!=='juego') return;
      if(S.claim) return 'Esperá: se está comprobando un canto.';
      if(S.drawn.length>=90) return 'Ya salieron las 90 bolillas.';
      if(Date.now()-S.lastBallAt<1200) return;
      draw(); break;
    case 'auto':
      if(!(isCantor||isHost) || S.phase!=='juego') return;
      S.auto=[0,5,8,12,20].includes(+a.sec) ? +a.sec : 0; break;
    case 'cantar': {
      if(S.phase!=='juego') return;
      const c=+a.card; if(S.owner[c]!==pid) return;
      if(S.anulados[c]) return 'Ese cartón está anulado.';
      if(!S.drawn.length) return 'Todavía no salió ninguna bolilla.';
      const tipo = a.tipo==='bingo' ? 'bingo' : 'linea';
      if(tipo==='linea' && S.cfg.modo!=='linea') return 'En esta sala solo se juega cartón lleno.';
      if(!S.claim){ S.claim={until:Date.now()+S.cfg.gracia*1000, list:[]}; clearTimeout(T.claim); T.claim=setTimeout(resolveClaims, S.cfg.gracia*1000); }
      if(S.claim.list.some(x=>x.card===c && x.tipo===tipo)) return;
      // junto con el canto va dónde puso su maíz, para mostrar en la comprobación en qué se equivocó
      const enCarton=new Set(cardNums(S.cards[c]));
      const marks=(Array.isArray(a.marks)?a.marks:[]).map(Number).filter(n=>enCarton.has(n)).slice(0,15);
      S.claim.list.push({pid, card:c, tipo, marks});
      sys(`📣 ${p.emoji} ${p.name} cantó ${tipo==='bingo'?'¡LOTERÍA!':'¡LÍNEA!'} (cartón N° ${c})`);
      break; }
    case 'cerrar':
      if(!isHost || S.phase!=='juego' || S.claim || S.drawn.length<90) return;
      finRonda(); break;
    /* ---------- chat de voz ---------- */
    case 'mic':
      if(p.bot) return; p.mic=!!a.on; break;
    case 'silenciar': {   // el anfitrión silencia a quien tiene el micrófono abierto (después lo puede volver a prender)
      const q=P(a.pid); if(!isHost || !q || !q.mic || q.id===pid) return;
      q.mic=false; q.muteSeq=(q.muteSeq||0)+1; sys(`🔇 El anfitrión silenció el micrófono de ${q.name}.`); break; }
    case 'chat': {
      const x=String(a.x||'').trim().slice(0,200); if(!x) return;
      S.chat.push({pid, name:p.name, emoji:p.emoji, x, at:Date.now()}); if(S.chat.length>120) S.chat.shift();
      break; }
    default: return;
  }
  commit();
}
// Comprueba un canto como lo haría el que controla en la vida real: se leen los números del cartón contra las bolillas que salieron.
function evalClaim(cl){
  const g=S.cards[cl.card], d=new Set(S.drawn), last=S.drawn[S.drawn.length-1];
  if(cl.tipo==='linea'){
    if(S.stage!=='linea') return {res:'cerrado'};
    const full=[0,1,2].filter(r=>g[r].every(n=>!n || d.has(n)));
    if(!full.length) return {res:'falso'};
    if(S.cfg.aTiempo){ const ok=full.filter(r=>g[r].includes(last)); return ok.length ? {res:'ok', row:ok[0]} : {res:'tarde', row:full[0]}; }
    return {res:'ok', row:full[0]};
  }
  const nums=cardNums(g);
  if(!nums.every(n=>d.has(n))) return {res:'falso'};
  if(S.cfg.aTiempo && !nums.includes(last)) return {res:'tarde'};
  return {res:'ok'};
}
function resolveClaims(){
  clearTimeout(T.claim);
  if(!S || !S.claim || NET.mode!=='host') return;
  const items = S.claim.list.map(cl=>({...cl, ...evalClaim(cl)}));
  // primero las multas por cantar en falso
  items.filter(i=>i.res==='falso').forEach(i=>{
    const p=P(i.pid); if(!p) return;
    if(S.cfg.falso==='anular'){ S.anulados[i.card]=true; i.pena='Cartón anulado por el resto de la ronda.'; }
    else if(S.cfg.falso==='multa'){ const m=Math.min(p.saldo, S.cfg.precio*2); p.saldo-=m; S.pozo.bingo+=m; i.pena=`Multa de ${gs(m)} (va al pozo de la lotería).`; }
    sys(`❌ ${p.emoji} ${p.name} cantó en falso con el cartón N° ${i.card}. ${i.pena||''}`);
  });
  items.filter(i=>i.res==='tarde').forEach(i=>{ const p=P(i.pid); if(p) sys(`⏰ ${p.emoji} ${p.name} cantó tarde: ya había salido otra bolilla. No vale.`); });
  const lin=items.filter(i=>i.tipo==='linea' && i.res==='ok'), bin=items.filter(i=>i.tipo==='bingo' && i.res==='ok');
  if(lin.length){
    const share=Math.floor(S.pozo.linea/lin.length);
    lin.forEach(i=>{ i.premio=share; P(i.pid).saldo+=share; sys(`🎉 ¡LÍNEA! ${P(i.pid).emoji} ${P(i.pid).name} cobra ${gs(share)} (cartón N° ${i.card}).`); });
    S.winners.linea=lin.map(i=>({pid:i.pid, card:i.card, premio:share, row:i.row})); S.stage='bingo';
  }
  if(bin.length){
    let pot=S.pozo.bingo;
    if(S.cfg.modo==='linea' && !S.winners.linea.length){ pot+=S.pozo.linea; S.lineaDesierta=true; sys('Nadie ganó la línea: su premio se suma a la lotería.'); }
    const share=Math.floor(pot/bin.length);
    bin.forEach(i=>{ i.premio=share; P(i.pid).saldo+=share; sys(`🏆 ¡LOTERÍA! ${P(i.pid).emoji} ${P(i.pid).name} cobra ${gs(share)} (cartón N° ${i.card}).`); });
    S.winners.bingo=bin.map(i=>({pid:i.pid, card:i.card, premio:share}));
  }
  S.claim=null; S.result={at:Date.now(), items, ball:S.drawn.length};
  if(bin.length) finRonda();
  commit();
}
function finRonda(){
  S.phase='fin'; S.auto=0;
  if(!S.winners.bingo.length){
    S.acum = S.pozo.bingo + (S.winners.linea.length ? 0 : S.pozo.linea);
    sys(`Salieron las 90 bolillas y nadie cantó lotería a tiempo. El pozo de ${gs(S.acum)} queda acumulado para la próxima ronda.`);
  }
  S.resumen={round:S.round, bolillas:S.drawn.length, linea:S.winners.linea, bingo:S.winners.bingo, acum:S.acum};
}

/* ---------- jugadores de la casa (bots) ---------- */
function botsBuy(){
  S.players.filter(p=>p.bot).forEach((b,i)=>{
    const n=1+randInt(2);
    for(let k=0;k<n;k++) setTimeout(()=>{ if(S && S.phase==='venta' && P(b.id) && NET.mode==='host') act(b.id,{t:'azar'}); }, 800+i*600+k*700+randInt(1200));
  });
}
// los vecinos de la casa a veces prestan cuando alguien pide (si les sobra)
function botsLend(){
  (S.pedidos||[]).forEach(ped=>{
    const b=S.players.filter(p=>p.bot && p.saldo>=ped.monto+S.cfg.precio*2).sort(()=>Math.random()-.5)[0];
    if(!b || Math.random()<.35) return;
    setTimeout(()=>{ if(S && NET.mode==='host' && P(b.id) && (S.pedidos||[]).some(x=>x.id===ped.id)) act(b.id,{t:'prestar', to:ped.pid, monto:ped.monto}); }, 2000+randInt(3000));
  });
}
function botsCheck(){
  const ball=S.drawn.length, last=S.drawn[ball-1], d=new Set(S.drawn);
  S.players.filter(p=>p.bot).forEach(b=>{
    myCards(b.id).filter(c=>!S.anulados[c]).forEach(c=>{
      const g=S.cards[c]; let tipo=null;
      if(cardNums(g).every(n=>d.has(n)) && cardNums(g).includes(last)) tipo='bingo';
      else if(S.stage==='linea' && g.some(r=>r.includes(last) && r.every(n=>!n||d.has(n)))) tipo='linea';
      if(!tipo || Math.random()<.12) return;   // a veces se distraen, como en la vida real
      setTimeout(()=>{ if(S && S.phase==='juego' && S.drawn.length===ball && NET.mode==='host') act(b.id,{t:'cantar', card:c, tipo}); }, 900+randInt(2000));
    });
  });
}

/* ---------- sorteo automático ---------- */
function scheduleAuto(){
  if(!S || NET.mode!=='host' || S.phase!=='juego' || !S.auto || S.claim || S.drawn.length>=90){ clearTimeout(T.auto); T.auto=null; T.autoKey=''; return; }
  const key=S.drawn.length+':'+S.auto+':'+(S.result?S.result.at:0);
  if(T.autoKey===key) return;
  clearTimeout(T.auto); T.autoKey=key;
  T.auto=setTimeout(()=>{ T.autoKey=''; if(S && S.phase==='juego' && S.auto && !S.claim && S.drawn.length<90){ draw(); commit(); } }, S.auto*1000 + (S.result?5000:0));
}

/* ====================== RED ====================== */
function newPeer(id){
  return new Peer(id, {debug:1, config:{iceServers: window.ICE_SERVERS || [{urls:"stun:stun.l.google.com:19302"}]}});
}
function publicState(){ const v=JSON.parse(JSON.stringify(S)); v.players.forEach(p=>delete p.token); return v; }
function commit(){
  if(NET.mode!=='host') return;
  store('lot_host', {S, code:NET.code, myPid:NET.myPid, at:Date.now()});
  const v=publicState();
  for(const pid in NET.conns){ const c=NET.conns[pid]; if(c && c.open) try{ c.send({t:'state', s:v, you:pid}); }catch(e){} }
  scheduleAuto(); render();
}
function doAct(a){
  if(NET.mode==='client'){ if(NET.hostConn && NET.hostConn.open) NET.hostConn.send({t:'act', a}); else toast('Sin conexión con el anfitrión.'); return; }
  if(NET.mode==='host'){ const r=act(NET.myPid, a); if(typeof r==='string') toast(r); }
}
// ---------- anfitrión ----------
function hostStart(resume){
  const saved = resume ? load('lot_host') : null;
  NET.mode='host'; NET.code = saved ? saved.code : genCode(); NET.conns={};
  const peer = NET.peer = newPeer(PREFIX+NET.code);
  peer.on('open', ()=>{
    netBar(false);
    if(saved){
      S=saved.S; NET.myPid=saved.myPid;
      S.players.forEach(p=>{ if(!p.bot){ p.conn = p.id===NET.myPid; p.mic=false; } });
      if(P(NET.myPid)) P(NET.myPid).peerId=peer.id;
      if(S.claim){ clearTimeout(T.claim); T.claim=setTimeout(resolveClaims, Math.max(500, S.claim.until-Date.now())); }
      if(S.phase==='venta') botsBuy();
      sys('El anfitrión volvió a abrir la sala.');
    } else {
      S=lobbyState();
      const me=addPlayer(cleanName(PREF.name), PREF.emoji, myToken); me.peerId=peer.id; NET.myPid=me.id; S.hostPid=me.id; S.cantorPid=me.id;
      sys(`Sala ${NET.code} creada. Pasá el código a los demás jugadores.`);
    }
    commit();
  });
  peer.on('call', onCall);
  peer.on('connection', conn=>{
    conn.on('data', d=>hostOnData(conn, d));
    conn.on('close', ()=>hostOnClose(conn));
    conn.on('error', ()=>hostOnClose(conn));
  });
  peer.on('disconnected', ()=>{ if(!peer.destroyed) setTimeout(()=>{ try{ peer.reconnect(); }catch(e){} }, 1500); });
  peer.on('error', e=>{
    if(e.type==='unavailable-id'){
      peer.destroy();
      if(resume){ toast('La sala ya está abierta en otro dispositivo.'); NET.mode=null; render(); }
      else hostStart(false);
      return;
    }
    if(e.type==='peer-unavailable') return;
    console.warn(e);
    if(['network','server-error','socket-error'].includes(e.type)) netBar('Problema de conexión con el servidor. Reintentando…');
  });
  render();
}
function hostOnData(conn, d){
  if(!S || !d) return;
  if(d.t==='hello'){
    let p=S.players.find(x=>!x.bot && x.token && x.token===d.token);
    if(!p){
      if(S.players.length>=MAX_SALA) { conn.send({t:'toast', x:'La sala está llena.'}); return; }
      p=addPlayer(cleanName(d.name), EMOJIS.includes(d.emoji)?d.emoji:'🙂', d.token);
      // entra como espectador (mira, chatea y puede ser el cantor) si lo pidió, si la mesa está completa o si la cantada ya empezó
      const porque = d.mirar ? 'solo quiere mirar' : jugadores().length>MAX_JUG ? `ya hay ${MAX_JUG} jugadores` : S.phase==='juego' ? 'la cantada ya empezó; puede sumarse a la mesa en la próxima ronda' : '';
      if(porque){ p.esp=true; sys(`👀 ${p.emoji} ${p.name} entró como espectador (${porque}).`); }
      else sys(`${p.emoji} ${p.name} entró a la sala.`);
    } else { p.conn=true; sys(`${p.emoji} ${p.name} volvió.`); }
    const old=NET.conns[p.id]; if(old && old!==conn) try{ old.close(); }catch(e){}
    conn.pid=p.id; NET.conns[p.id]=conn; p.peerId=conn.peer; p.mic=false;   // para el chat de voz
    commit(); return;
  }
  if(!conn.pid || NET.conns[conn.pid]!==conn) return;
  if(d.t==='act'){ const r=act(conn.pid, d.a); if(typeof r==='string') try{ conn.send({t:'toast', x:r}); }catch(e){} }
  // el cantor de la sala manda el audio de la bolilla: se reenvía a todos y se escucha acá
  else if(d.t==='canto' && S.vozSala && conn.pid===S.vozSala.pid){ enviarCanto(d, conn.pid); recibirCanto(d); }
}
function hostOnClose(conn){
  if(!S || !conn.pid || NET.conns[conn.pid]!==conn) return;
  delete NET.conns[conn.pid];
  const p=P(conn.pid); if(p){ p.conn=false; p.mic=false; sys(`${p.emoji} ${p.name} se desconectó.`); }
  commit();
}
// ---------- cliente ----------
function clientJoin(code, mirar){
  NET.mode='client'; NET.code=code; NET.welcomed=false; NET.mirar=!!mirar; S=null;
  const peer = NET.peer = newPeer();
  peer.on('call', onCall);
  peer.on('open', ()=>connectHost());
  peer.on('disconnected', ()=>{ if(!peer.destroyed) setTimeout(()=>{ try{ peer.reconnect(); }catch(e){} }, 1500); });
  peer.on('error', e=>{
    if(e.type==='peer-unavailable'){
      if(!NET.welcomed){ toast('No se encontró la sala '+code+'. Revisá el código.'); leave(true); }
      else { netBar('El anfitrión no responde. Reintentando…'); setTimeout(connectHost, 3000); }
      return;
    }
    console.warn(e);
  });
  render();
}
function connectHost(){
  if(NET.mode!=='client' || !NET.peer || NET.peer.destroyed) return;
  if(NET.hostConn && NET.hostConn.open) return;
  const c = NET.peer.connect(PREFIX+NET.code, {reliable:true});
  NET.hostConn=c;
  c.on('open', ()=>{ netBar(false); c.send({t:'hello', name:cleanName(PREF.name), emoji:PREF.emoji, token:myToken, mirar:NET.mirar}); });
  c.on('data', d=>{
    if(NET.hostConn!==c || !d) return;
    if(d.t==='state'){ NET.welcomed=true; S=d.s; NET.myPid=d.you; store('lot_client', {code:NET.code, at:Date.now()}); render(); }
    else if(d.t==='toast') toast(d.x);
    else if(d.t==='canto') recibirCanto(d);
    else if(d.t==='kicked'){ toast('El anfitrión te sacó de la sala.'); leave(true); }
  });
  c.on('close', ()=>{ if(NET.mode!=='client' || NET.hostConn!==c) return; netBar('Se perdió la conexión con el anfitrión. Reconectando…'); setTimeout(connectHost, 3000); });
}
function leave(clear){
  apagarVoz();
  if(NET.peer) try{ NET.peer.destroy(); }catch(e){}
  clearTimeout(T.auto); clearTimeout(T.claim);
  if(clear){ forget(NET.mode==='host'?'lot_host':'lot_client'); }
  NET.mode=null; NET.peer=null; NET.conns={}; NET.hostConn=null; S=null; netBar(false);
  $('#chat').classList.remove('on'); closeOv(); render();
}

/* ====================== CHAT DE VOZ ======================
   Igual que en el Banquero: cada uno que prende el micrófono llama a todos los que están conectados (jugadores y
   espectadores); los demás contestan y lo escuchan. El anfitrión puede silenciar a alguien. */
const VOICE={stream:null, calls:{}, audios:{}, muted:false, muteSeq:null};
function stopMic(avisar){
  if(!VOICE.stream) return;
  VOICE.stream.getTracks().forEach(t=>t.stop()); VOICE.stream=null;
  Object.values(VOICE.calls).forEach(c=>{ try{ c.close(); }catch(e){} }); VOICE.calls={};
  if(avisar) doAct({t:'mic', on:false});
}
async function toggleMic(){
  if(VOICE.stream){ stopMic(true); render(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast('Este navegador no permite usar el micrófono (se necesita HTTPS).');
  try{ VOICE.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}); }
  catch(e){ return toast('No se pudo activar el micrófono. Revisá el permiso del navegador (el candado de la barra de direcciones).'); }
  toast('🎤 Micrófono activado: todos en la sala te escuchan.');
  doAct({t:'mic', on:true}); voiceSync(); render();
}
// llama a los conectados que todavía no tienen mi voz, y corta a los que se fueron
function voiceSync(){
  if(!VOICE.stream || !NET.peer || !S) return;
  const yo=NET.peer.id, vivos=new Set();
  for(const p of S.players){
    if(p.bot || !p.conn || !p.peerId || p.peerId===yo) continue;
    vivos.add(p.peerId);
    if(!VOICE.calls[p.peerId]){
      const c=NET.peer.call(p.peerId, VOICE.stream); if(!c) continue;
      VOICE.calls[p.peerId]=c;
      const fuera=()=>{ if(VOICE.calls[p.peerId]===c) delete VOICE.calls[p.peerId]; };
      c.on('close', fuera); c.on('error', fuera);
    }
  }
  for(const id in VOICE.calls) if(!vivos.has(id)){ try{ VOICE.calls[id].close(); }catch(e){} delete VOICE.calls[id]; }
}
function onCall(call){
  call.answer();
  call.on('stream', st=>{
    let a=VOICE.audios[call.peer];
    if(!a){ a=document.createElement('audio'); a.autoplay=true; a.setAttribute('playsinline',''); document.body.appendChild(a); VOICE.audios[call.peer]=a; }
    a.srcObject=st; a.muted=VOICE.muted; a.play().catch(()=>{});
  });
  call.on('close', ()=>{ const a=VOICE.audios[call.peer]; if(a){ a.srcObject=null; a.remove(); delete VOICE.audios[call.peer]; } });
}
function toggleSpk(){
  VOICE.muted=!VOICE.muted;
  Object.values(VOICE.audios).forEach(a=>{ a.muted=VOICE.muted; if(!VOICE.muted) a.play().catch(()=>{}); });
  toast(VOICE.muted ? '🔇 No escuchás a los demás.' : '🔊 Escuchás a los que hablan.'); render();
}
function apagarVoz(){
  if(VOICE.stream){ VOICE.stream.getTracks().forEach(t=>t.stop()); VOICE.stream=null; }
  Object.values(VOICE.calls).forEach(c=>{ try{ c.close(); }catch(e){} }); VOICE.calls={};
  Object.values(VOICE.audios).forEach(a=>{ a.srcObject=null; a.remove(); }); VOICE.audios={}; VOICE.muteSeq=null;
}
// ¿el anfitrión me silenció? (cada silenciada sube un contador; al entrar no cuenta lo viejo)
function checkForcedMute(){
  const m=me(); if(!m) return;
  const seq=m.muteSeq||0;
  if(VOICE.muteSeq==null){ VOICE.muteSeq=seq; return; }
  if(seq>VOICE.muteSeq){ VOICE.muteSeq=seq; if(VOICE.stream){ stopMic(false); toast('🔇 El anfitrión silenció tu micrófono. Podés volver a activarlo cuando quieras.'); } }
}

// fichas de madera como las de la lotería de casa; se subrayan las que se confunden dadas vuelta (6 y 9, 16 y 91…)
const GIRA={0:'0',1:'1',6:'9',8:'8',9:'6'};
const subraya = n => { const s=String(n); if(![...s].every(d=>GIRA[d]!==undefined)) return false; const r=[...s].reverse().map(d=>GIRA[d]).join(''); return r[0]!=='0' && +r!==n && +r>=1 && +r<=90; };
function ball(n, cls=''){ return `<div class="ball ${cls}"><span class="${subraya(n)?'u':''}">${n}</span></div>`; }

    return `<div class="pl ${p.id===NET.myPid?'me':''} ${!p.conn&&!p.bot?'off':''}">${p.emoji} <b>${esc(p.name)}</b>
      ${p.id===S.hostPid?'👑':''}${p.id===S.cantorPid?'🎤':''}${p.bot?'🤖':''}${p.mic?'<span class="habla" title="Tiene el micrófono abierto">🔊 hablando</span>':''}${host && p.mic && p.id!==NET.myPid?`<button class="x" title="Silenciar a ${esc(p.name)}" data-act="silenciar" data-pid="${p.id}">🔇</button>`:''}
      ${p.esp?'':`<span>${gs(p.saldo)}</span>`}${n?`<span>· 🎟️${n}</span>`:''}
      ${host && p.id!==S.hostPid && S.phase!=='juego' ? `<button class="x" title="Sacar de la sala" data-act="quitar" data-pid="${p.id}">✕</button>`:''}</div>`;
  };
  // espectador: puede pasar a la mesa si hay lugar; jugador sin cartones en juego: puede dejar su lugar
  let aviso='';
  if(m && m.esp) aviso=`<div class="espbar">👀 Estás como <b>espectador</b>: mirás, chateás${S.cantorPid===m.id?' y sos el cantor 🎤':' y podés ser el cantor'}.
      ${mesa>=MAX_JUG ? `<span class="muted" style="color:#ddd">La mesa está completa: si se libera un lugar, vas a poder jugar.</span>`

        : `<button class="btn sm green" data-act="jugar">🎟️ Quiero jugar (hay lugar)</button>`}</div>`;
  else if(m && !m.bot && S.phase!=='juego') aviso=`<div class="espbar" style="background:none;padding:0 2px;margin-top:-4px"><button class="btn sm gray" data-act="mirar">👀 Prefiero solo mirar (dejar mi lugar)</button></div>`;
  return `<div class="players"><span class="pl" style="background:none">🎟️ Mesa ${mesa}/${MAX_JUG}</span>${S.players.filter(p=>!p.esp).map(ficha).join('')}</div>
    ${esps.length?`<div class="players"><span class="pl" style="background:none">👀 Espectadores</span>${esps.map(ficha).join('')}</div>`:''}${aviso}`;
}

function explicaFalso(i){
  const g=S.cards[i.card], d=new Set(S.drawn), marks=i.marks||[];
  const mal=marks.filter(n=>!d.has(n)).sort((a,b)=>a-b);
  let faltan;
  if(i.tipo==='linea'){ const filas=g.map(r=>r.filter(n=>n && !d.has(n))); faltan=filas.sort((a,b)=>a.length-b.length)[0]; }
  else faltan=cardNums(g).filter(n=>!d.has(n));
  return `<div style="margin-bottom:6px">${mal.length?`🌽 Puso maíz en <b>${mal.join(', ')}</b> y ${mal.length>1?'esos números no salieron':'ese número no salió'}.<br>`:''}
    ${faltan.length?`Le ${faltan.length>1?'faltan':'falta'} <b>${faltan.join(', ')}</b> para ${i.tipo==='linea'?'completar la línea':'llenar el cartón'}.`:''}
    <div class="muted">Los números en rojo no salieron. La partida sigue.</div></div>`;
